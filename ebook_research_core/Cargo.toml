[package]
name = "ebook_research_core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mstyles/pitaka"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
zip = "0.6"
quick-xml = "0.31"
sha2 = "0.10"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite_migration = "2.6"

[features]
# Semantic chapter search (docs/plans/semantic-chapter-search.md). Off by
# default: it needs an embedding model, downloaded on first use.
semantic = []

[dev-dependencies]
serde_json = "1"
