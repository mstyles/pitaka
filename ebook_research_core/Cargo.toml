[package]
name = "ebook_research_core"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mstyles/pitaka"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "functions", "backup"] }
zip = "8.6"
# `escape-html` so text using HTML named entities (`&nbsp;`, `&mdash;`)
# unescapes instead of being dropped.
quick-xml = { version = "0.42", features = ["escape-html"] }
sha2 = "0.11"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite_migration = "2.6"
walkdir = "2"
# PDF text extraction. Its `lopdf` re-export also reads the outline and
# metadata.
pdf-extract = "0.12"
# The embedding model for semantic search, only with the `semantic` feature.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
# 0.4's small sync client; 1.0 is a full async Hub client, far more than
# fetching three files needs.
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
# Book covers: decodes an EPUB's or PDF's cover and writes a small JPEG
# thumbnail. Pure Rust, JPEG and PNG only.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Backup manifests, and the embedding model's config with `semantic`.
serde_json = "1"

[features]
# Semantic chapter search (docs/plans/semantic-chapter-search.md). Off by
# default: it needs an embedding model, downloaded on first use.
semantic = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
