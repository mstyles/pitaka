[workspace]
resolver = "2"
members = ["ebook_research_core", "src-tauri"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# No `panic = "abort"`: the PDF importer catches pdf-extract's panics on
# fonts it can't read with `catch_unwind`, so a malformed PDF is an import
# error instead of a crash.
strip = true
